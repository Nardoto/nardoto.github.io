<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="t" font-family="Inter,'Segoe UI',Arial,sans-serif">
  <title id="t">Antes e depois de fatiar a base: 9,2 segundos lendo a base inteira contra 0,4 a 0,8 segundo com fatias; a base tem 80,9 MB, as abas usam 36 MB e o Radar do app usa 4,4 MB</title>
  <rect width="1200" height="480" rx="18" fill="#141414"/>

  <text x="40" y="52" fill="#fff" font-size="24" font-weight="700">Tempo até a resposta</text>
  <text x="40" y="80" fill="#9CA3AF" font-size="17">segundos, quanto menor melhor</text>

  <text x="40" y="128" fill="#B4B9C2" font-size="18">Base inteira, função parada</text>
  <rect x="330" y="106" width="700" height="34" rx="6" fill="#3A3A3A"/>
  <text x="1044" y="130" fill="#fff" font-size="20" font-weight="700">9,2 s</text>

  <text x="40" y="180" fill="#B4B9C2" font-size="18">Fatias, função acordada</text>
  <rect x="330" y="158" width="61" height="34" rx="6" fill="#E85A2A"/>
  <text x="405" y="182" fill="#fff" font-size="20" font-weight="700">0,4 a 0,8 s</text>

  <rect x="40" y="226" width="1120" height="1" fill="#2A2A2A"/>

  <text x="40" y="272" fill="#fff" font-size="24" font-weight="700">Quanto da base cada parte usa</text>
  <text x="40" y="300" fill="#9CA3AF" font-size="17">megabytes, medido em 3 de novembro de 2026</text>

  <text x="40" y="348" fill="#B4B9C2" font-size="18">Arquivo da base</text>
  <rect x="330" y="326" width="700" height="34" rx="6" fill="#3A3A3A"/>
  <text x="1044" y="350" fill="#fff" font-size="20" font-weight="700">80,9 MB</text>

  <text x="40" y="400" fill="#B4B9C2" font-size="18">O que as abas usam</text>
  <rect x="330" y="378" width="311" height="34" rx="6" fill="#5A3A2E"/>
  <text x="655" y="402" fill="#fff" font-size="20" font-weight="700">36 MB</text>

  <text x="40" y="452" fill="#B4B9C2" font-size="18">Radar dentro do app</text>
  <rect x="330" y="430" width="38" height="34" rx="6" fill="#E85A2A"/>
  <text x="382" y="454" fill="#fff" font-size="20" font-weight="700">4,4 MB</text>
</svg>
