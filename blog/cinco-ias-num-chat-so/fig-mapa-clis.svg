<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 590" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-labelledby="t">
<title id="t">Mapa dos quatro CLIs que o chat usa: processo, protocolo e onde entra o MCP de cada um</title>
<rect width="1200" height="590" rx="18" fill="#141414"/>
<text x="40" y="52" fill="#E85A2A" font-size="16" font-weight="700" letter-spacing="2">UM CHAT, QUATRO PROTOCOLOS</text>
<g font-size="17" font-weight="700" fill="#9CA3AF" letter-spacing="1.5">
<text x="52" y="98">CLI</text><text x="250" y="98">PROCESSO</text><text x="560" y="98">PROTOCOLO</text><text x="850" y="98">ONDE ENTRA O MCP</text></g>

<rect x="30" y="112" width="1140" height="92" rx="14" fill="#1A1A1A"/>
<rect x="545" y="122" width="290" height="72" rx="10" fill="#2A1710"/>
<text x="52" y="152" fill="#fff" font-size="22" font-weight="700">Claude Code</text>
<text x="52" y="180" fill="#9CA3AF" font-size="17">Anthropic</text>
<text x="250" y="152" fill="#fff" font-size="18">um processo por aba</text>
<text x="250" y="180" fill="#B4B9C2" font-size="18">fecha após 10 min parado</text>
<text x="560" y="152" fill="#FF8A5C" font-size="18" font-weight="700">stream-json bidirecional</text>
<text x="560" y="180" fill="#B4B9C2" font-size="18">pedidos control_request</text>
<text x="850" y="152" fill="#fff" font-size="18">--mcp-config por turno</text>
<text x="850" y="180" fill="#B4B9C2" font-size="18">e --strict-mcp-config</text>

<rect x="30" y="216" width="1140" height="92" rx="14" fill="#1A1A1A"/>
<rect x="545" y="226" width="290" height="72" rx="10" fill="#2A1710"/>
<text x="52" y="256" fill="#fff" font-size="22" font-weight="700">Codex</text>
<text x="52" y="284" fill="#9CA3AF" font-size="17">OpenAI</text>
<text x="250" y="256" fill="#fff" font-size="18">um app-server para todas</text>
<text x="250" y="284" fill="#B4B9C2" font-size="18">cada aba é uma thread</text>
<text x="560" y="256" fill="#FF8A5C" font-size="18" font-weight="700">JSON-RPC 2.0 por linha</text>
<text x="560" y="284" fill="#B4B9C2" font-size="18">thread/start, turn/start</text>
<text x="850" y="256" fill="#fff" font-size="18">~/.codex/config.toml</text>
<text x="850" y="284" fill="#B4B9C2" font-size="18">lido só no boot do servidor</text>

<rect x="30" y="320" width="1140" height="92" rx="14" fill="#1A1A1A"/>
<rect x="545" y="330" width="290" height="72" rx="10" fill="#2A1710"/>
<text x="52" y="360" fill="#fff" font-size="22" font-weight="700">agy</text>
<text x="52" y="388" fill="#9CA3AF" font-size="17">Antigravity</text>
<text x="250" y="360" fill="#fff" font-size="18">um processo por aba</text>
<text x="250" y="388" fill="#B4B9C2" font-size="18">mesma classe do Claude</text>
<text x="560" y="360" fill="#FF8A5C" font-size="18" font-weight="700">stream-json no stdin</text>
<text x="560" y="388" fill="#B4B9C2" font-size="18">um turno por linha</text>
<text x="850" y="360" fill="#fff" font-size="18">mcp_config.json global</text>
<text x="850" y="388" fill="#B4B9C2" font-size="18">regravado antes do spawn</text>

<rect x="30" y="424" width="1140" height="92" rx="14" fill="#1A1A1A"/>
<rect x="545" y="434" width="290" height="72" rx="10" fill="#2A1710"/>
<text x="52" y="464" fill="#fff" font-size="22" font-weight="700">Grok</text>
<text x="52" y="492" fill="#9CA3AF" font-size="17">xAI</text>
<text x="250" y="464" fill="#fff" font-size="18">um por modelo e esforço</text>
<text x="250" y="492" fill="#B4B9C2" font-size="18">cada aba é uma sessão</text>
<text x="560" y="464" fill="#FF8A5C" font-size="18" font-weight="700">ACP, JSON-RPC por linha</text>
<text x="560" y="492" fill="#B4B9C2" font-size="18">session/new e /prompt</text>
<text x="850" y="464" fill="#fff" font-size="18">~/.grok/config.toml</text>
<text x="850" y="492" fill="#B4B9C2" font-size="18">poucos servidores stdio</text>

<text x="40" y="556" fill="#9CA3AF" font-size="18">O nome gemini do app hoje aponta para o agy: o Gemini CLI saiu do código em 24/07/2026.</text>
</svg>
