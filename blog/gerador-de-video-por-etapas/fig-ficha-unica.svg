<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-labelledby="t">
<title id="t">A ficha única do vídeo: o painel e o agente do chat leem e escrevem o mesmo estado.json</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E85A2A"/></marker></defs>
<rect width="1200" height="420" rx="18" fill="#141414"/>
<text x="40" y="52" fill="#E85A2A" font-size="16" font-weight="700" letter-spacing="2">UMA FICHA, DUAS TELAS</text>
<rect x="30" y="90" width="270" height="170" rx="14" fill="#1A1A1A"/>
<text x="52" y="132" fill="#fff" font-size="24" font-weight="700">Painel</text>
<text x="52" y="168" fill="#B4B9C2" font-size="18">formulário e etapas</text>
<text x="52" y="194" fill="#B4B9C2" font-size="18">botão Continuar</text>
<text x="52" y="220" fill="#B4B9C2" font-size="18">mostra o andamento</text>
<rect x="470" y="90" width="290" height="170" rx="14" fill="#2A1710"/>
<text x="492" y="132" fill="#FF8A5C" font-size="24" font-weight="700">estado.json</text>
<text x="492" y="168" fill="#B4B9C2" font-size="18">.nardoto-video/</text>
<text x="492" y="194" fill="#B4B9C2" font-size="18">etapa, status, resumo,</text>
<text x="492" y="220" fill="#B4B9C2" font-size="18">arquivos e avisos</text>
<rect x="930" y="90" width="240" height="170" rx="14" fill="#1A1A1A"/>
<text x="952" y="132" fill="#fff" font-size="22" font-weight="700">Agente no chat</text>
<text x="952" y="168" fill="#B4B9C2" font-size="18">executa o briefing</text>
<text x="952" y="194" fill="#B4B9C2" font-size="18">grava cada passo</text>
<text x="952" y="220" fill="#B4B9C2" font-size="18">ajusta a pedido</text>
<path d="M926 150H764" stroke="#E85A2A" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text x="845" y="134" fill="#9CA3AF" font-size="17" text-anchor="middle">grava</text>
<path d="M466 150H304" stroke="#E85A2A" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text x="385" y="134" fill="#9CA3AF" font-size="17" text-anchor="middle">lê a cada 3 s</text>
<path d="M165 264V335H1050V264" stroke="#E85A2A" stroke-width="2.5" fill="none" stroke-dasharray="7 6" marker-end="url(#a)"/>
<text x="607" y="323" fill="#B4B9C2" font-size="17" text-anchor="middle">o pedido vira briefing e a ferramenta o devolve ao agente</text>
<text x="600" y="390" fill="#9CA3AF" font-size="18" text-anchor="middle">Recarregou a tela? A ficha continua no disco e a sessão do chat é retomada.</text>
</svg>
