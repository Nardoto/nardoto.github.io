<rect x="970" y="80" width="200" height="120" rx="14" fill="#1A1A1A"/>
<text x="990" y="120" fill="#fff" font-size="22" font-weight="700">5 veo3</text>
<text x="990" y="150" fill="#B4B9C2" font-size="17">se houver cena</text>
