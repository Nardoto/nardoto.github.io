<rect x="265" y="80" width="200" height="120" rx="14" fill="#1A1A1A"/>
<text x="285" y="120" fill="#fff" font-size="22" font-weight="700">2 voz</text>
<text x="285" y="150" fill="#B4B9C2" font-size="17">vozes do app</text>
<path d="M469 140H496" stroke="#E85A2A" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<rect x="500" y="80" width="200" height="120" rx="14" fill="#1A1A1A"/>
<text x="520" y="120" fill="#fff" font-size="22" font-weight="700">3 cortes</text>
<text x="520" y="150" fill="#B4B9C2" font-size="17">cenas pelo SRT</text>
