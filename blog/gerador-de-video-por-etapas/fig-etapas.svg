<rect x="970" y="290" width="200" height="120" rx="14" fill="#2A1710"/>
<text x="990" y="330" fill="#FF8A5C" font-size="22" font-weight="700">10 montagem</text>
<text x="990" y="360" fill="#B4B9C2" font-size="17">Editor ou CapCut</text>
<text x="990" y="389" fill="#FF8A5C" font-size="17" font-weight="700">MP4 só aprovado</text>
<path d="M1070 204V245H130V286" stroke="#E85A2A" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
<text x="600" y="234" fill="#9CA3AF" font-size="17" text-anchor="middle">motion e trilha andam enquanto o VEO3 gera</text>
<rect x="30" y="440" width="1140" height="64" rx="14" fill="#1A1A1A"/>
<text x="56" y="480" fill="#fff" font-size="19">Em volta das 10 etapas: fila por memória, pausa e vigia que retoma o que parou</text>
