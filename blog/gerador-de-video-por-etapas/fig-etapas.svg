<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-labelledby="t">
<title id="t">As 10 etapas do painel Criar Vídeo, na ordem, com as etapas que têm conferência em destaque</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E85A2A"/></marker></defs>
<rect width="1200" height="530" rx="18" fill="#141414"/>
<text x="40" y="52" fill="#E85A2A" font-size="16" font-weight="700" letter-spacing="2">AS 10 ETAPAS DO PAINEL, NA ORDEM</text>
<text x="1160" y="52" fill="#9CA3AF" font-size="17" text-anchor="end">Destaque: etapa com conferência</text>
<rect x="30" y="80" width="200" height="120" rx="14" fill="#2A1710"/>
<text x="50" y="120" fill="#FF8A5C" font-size="22" font-weight="700">1 roteiro</text>
<text x="50" y="150" fill="#B4B9C2" font-size="17">texto humano</text>
<text x="50" y="179" fill="#FF8A5C" font-size="17" font-weight="700">júri, 3 rodadas</text>
