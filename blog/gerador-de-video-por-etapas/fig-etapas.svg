<rect x="735" y="290" width="200" height="120" rx="14" fill="#2A1710"/>
<text x="755" y="330" fill="#FF8A5C" font-size="22" font-weight="700">9 revisão</text>
<text x="755" y="360" fill="#B4B9C2" font-size="17">conferir mídia</text>
<text x="755" y="389" fill="#FF8A5C" font-size="17" font-weight="700">ffprobe + IA</text>
