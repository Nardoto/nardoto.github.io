<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="t" font-family="Inter,'Segoe UI',Arial,sans-serif">
  <title id="t">Medidas de exportação: codificador da placa de vídeo a 71 quadros por segundo contra 25 do codificador em software, e gravar animações na hora levando 5 minutos e 30 segundos contra 4 minutos e 45 segundos desenhando ao vivo</title>
  <rect width="1200" height="460" rx="18" fill="#141414"/>

  <text x="40" y="52" fill="#fff" font-size="24" font-weight="700">Velocidade do codificador H.264, em 1080p a 30 quadros</text>
  <text x="40" y="80" fill="#9CA3AF" font-size="17">quadros por segundo, quanto maior melhor</text>

  <text x="40" y="128" fill="#B4B9C2" font-size="18">Placa de vídeo (NVENC)</text>
  <rect x="300" y="106" width="710" height="34" rx="6" fill="#E85A2A"/>
  <text x="1024" y="130" fill="#fff" font-size="20" font-weight="700">71</text>

  <text x="40" y="180" fill="#B4B9C2" font-size="18">Software (x264)</text>
  <rect x="300" y="158" width="250" height="34" rx="6" fill="#3A3A3A"/>
  <text x="564" y="182" fill="#fff" font-size="20" font-weight="700">25</text>

  <rect x="40" y="226" width="1120" height="1" fill="#2A2A2A"/>

  <text x="40" y="272" fill="#fff" font-size="24" font-weight="700">Exportar um vídeo novo com animações</text>
  <text x="40" y="300" fill="#9CA3AF" font-size="17">tempo total, quanto menor melhor</text>

  <text x="40" y="348" fill="#B4B9C2" font-size="18">Gravando o cache na hora</text>
  <rect x="300" y="326" width="710" height="34" rx="6" fill="#3A3A3A"/>
  <text x="1024" y="350" fill="#fff" font-size="20" font-weight="700">5 min 30 s</text>

  <text x="40" y="400" fill="#B4B9C2" font-size="18">Desenhando ao vivo</text>
  <rect x="300" y="378" width="613" height="34" rx="6" fill="#E85A2A"/>
  <text x="927" y="402" fill="#fff" font-size="20" font-weight="700">4 min 45 s</text>

  <text x="40" y="440" fill="#9CA3AF" font-size="17">Por isso a exportação só lê o cache que já existe; quem grava é a produção, antes.</text>
</svg>
