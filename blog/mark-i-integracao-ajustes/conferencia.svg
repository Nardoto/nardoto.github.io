<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="t"><title id="t">Vídeo pronto? Vale conferir.</title><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18120f"/><stop offset=".5" stop-color="#111317"/><stop offset="1" stop-color="#24130e"/></linearGradient><linearGradient id="glass"><stop stop-color="#eeeeee" stop-opacity=".14"/><stop offset="1" stop-color="#eeeeee" stop-opacity=".02"/></linearGradient><linearGradient id="ember"><stop stop-color="#ffad71"/><stop offset="1" stop-color="#e85a2a"/></linearGradient><radialGradient id="glow"><stop stop-color="#e85a2a" stop-opacity=".3"/><stop offset="1" stop-color="#e85a2a" stop-opacity="0"/></radialGradient><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#ff9c70"/></marker></defs><rect width="1200" height="600" rx="22" fill="url(#bg)"/><circle cx="1060" cy="80" r="310" fill="url(#glow)"/><g font-family="Inter,'Segoe UI',Arial,sans-serif"><text x="60" y="72" fill="#fff" font-size="46" font-weight="700">Vídeo pronto? Vale conferir.</text><text x="60" y="118" fill="#c9c5c1" font-size="26" >Um arquivo exportado responde só a parte da pergunta.</text><rect x="60" y="175" width="510" height="148" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="108" cy="223" r="25" fill="#e85a2a" fill-opacity=".22"/><text x="108" y="232" text-anchor="middle" font-size="25" fill="#ffb38c" font-weight="700">I</text><text x="150" y="228" fill="#fff" font-size="32" font-weight="700">IMAGEM</text><text x="88" y="286" fill="#c5c5c7" font-size="25" >A mídia representa a cena?</text><rect x="630" y="175" width="510" height="148" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="678" cy="223" r="25" fill="#e85a2a" fill-opacity=".22"/><text x="678" y="232" text-anchor="middle" font-size="25" fill="#ffb38c" font-weight="700">R</text><text x="720" y="228" fill="#fff" font-size="32" font-weight="700">REFERÊNCIAS</text><text x="658" y="286" fill="#c5c5c7" font-size="25" >A origem pode ser conferida?</text><rect x="60" y="370" width="510" height="148" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="108" cy="418" r="25" fill="#e85a2a" fill-opacity=".22"/><text x="108" y="427" text-anchor="middle" font-size="25" fill="#ffb38c" font-weight="700">A</text><text x="150" y="423" fill="#fff" font-size="32" font-weight="700">ÁUDIO</text><text x="88" y="481" fill="#c5c5c7" font-size="25" >A voz e a trilha estão adequadas?</text><rect x="630" y="370" width="510" height="148" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".14"/><circle cx="678" cy="418" r="25" fill="#e85a2a" fill-opacity=".22"/><text x="678" y="427" text-anchor="middle" font-size="25" fill="#ffb38c" font-weight="700">P</text><text x="720" y="423" fill="#fff" font-size="32" font-weight="700">PROJETO</text><text x="658" y="481" fill="#c5c5c7" font-size="25" >A edição continua acessível?</text></g></svg>