<g stroke="#E85A2A" stroke-width="2.5" fill="none"><path d="M960 87H992" marker-end="url(#a)"/><path d="M960 139H992" marker-end="url(#a)"/><path d="M960 191H992" marker-end="url(#a)"/><path d="M960 243H992" marker-end="url(#a)"/></g>
<g font-size="17" fill="#fff"><rect x="996" y="67" width="184" height="40" rx="10" fill="#1A1A1A"/><text x="1012" y="93">Projeto e CapCut</text>
<rect x="996" y="119" width="184" height="40" rx="10" fill="#1A1A1A"/><text x="1012" y="145">Voz e roteiro</text>
<rect x="996" y="171" width="184" height="40" rx="10" fill="#1A1A1A"/><text x="1012" y="197">Render de vídeo</text></g>
<rect x="996" y="223" width="184" height="40" rx="10" fill="#2A1710"/><text x="1012" y="249" fill="#FF8A5C" font-size="17" font-weight="700">A tela do app</text>
