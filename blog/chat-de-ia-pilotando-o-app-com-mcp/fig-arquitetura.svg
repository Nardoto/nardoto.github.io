<text x="52" y="132" fill="#fff" font-size="24" font-weight="700">CLI da IA</text>
<text x="52" y="168" fill="#B4B9C2" font-size="18">Claude Code,</text>
<text x="52" y="194" fill="#B4B9C2" font-size="18">Codex, Gemini,</text>
<text x="52" y="220" fill="#B4B9C2" font-size="18">Antigravity, Grok</text>
