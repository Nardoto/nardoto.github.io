<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-labelledby="t">
<title id="t">Arquitetura: CLI da IA, servidor MCP, processo principal do Electron e as ações do app</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#E85A2A"/></marker></defs>
<rect width="1200" height="400" rx="18" fill="#141414"/>
<text x="40" y="52" fill="#E85A2A" font-size="16" font-weight="700" letter-spacing="2">COMO A IA CHEGA NO APP</text>
