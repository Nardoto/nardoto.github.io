<text x="485" y="296" fill="#B4B9C2" font-size="17" text-anchor="middle">resposta {id, success, data}</text>
<text x="600" y="362" fill="#9CA3AF" font-size="18" text-anchor="middle">A IA lê o resultado (inclusive um print da tela) e decide o próximo passo.</text>
