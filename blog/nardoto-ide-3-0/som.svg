<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 384" role="img" aria-labelledby="t">
  <title id="t">Caminho do som de fim de tarefa: as notas passam pelo volume e vão para a saída; o eco, feito de ruído branco, agora passa por um filtro que corta acima de 1.800 Hz antes de chegar à saída.</title>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="seta-laranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#E85A2A"/>
    </marker>
  </defs>
  <rect width="1200" height="384" rx="18" fill="#141414"/>
  <g font-family="Inter,'Segoe UI',Arial,sans-serif">
    <text x="60" y="70" font-size="28" font-weight="700" fill="#fff">Como o som é montado</text>
    <text x="60" y="104" font-size="19" fill="#9CA3AF">Nenhum arquivo de áudio: tudo é calculado na hora</text>

    <rect x="60" y="200" width="210" height="84" rx="12" fill="#1A1A1A"/>
    <text x="165" y="236" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Notas</text>
    <text x="165" y="264" text-anchor="middle" font-size="17" fill="#9CA3AF">ondas puras</text>

    <rect x="340" y="200" width="190" height="84" rx="12" fill="#1A1A1A"/>
    <text x="435" y="250" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Volume</text>

    <rect x="620" y="140" width="240" height="72" rx="12" fill="#1A1A1A"/>
    <text x="740" y="170" text-anchor="middle" font-size="19" font-weight="600" fill="#fff">Som seco</text>
    <text x="740" y="196" text-anchor="middle" font-size="17" fill="#9CA3AF">direto</text>

    <rect x="620" y="276" width="240" height="72" rx="12" fill="#1A1A1A"/>
    <text x="740" y="306" text-anchor="middle" font-size="19" font-weight="600" fill="#fff">Eco</text>
    <text x="740" y="332" text-anchor="middle" font-size="17" fill="#9CA3AF">ruído branco</text>


    <rect x="905" y="276" width="235" height="72" rx="12" fill="#2A1710"/>
    <text x="1022" y="306" text-anchor="middle" font-size="19" font-weight="600" fill="#FF8A5C">Filtro novo</text>
    <text x="1022" y="332" text-anchor="middle" font-size="17" fill="#FF8A5C">corta acima de 1.800 Hz</text>

    <rect x="960" y="140" width="180" height="72" rx="12" fill="#1A1A1A"/>
    <text x="1050" y="183" text-anchor="middle" font-size="20" font-weight="600" fill="#fff">Saída</text>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M270 242 H332" stroke="#9CA3AF" marker-end="url(#seta)"/>
    <path d="M530 230 C570 230 580 176 612 176" stroke="#9CA3AF" marker-end="url(#seta)"/>
    <path d="M530 254 C570 254 580 312 612 312" stroke="#9CA3AF" marker-end="url(#seta)"/>
    <path d="M860 176 H952" stroke="#9CA3AF" marker-end="url(#seta)"/>
    <path d="M860 312 H897" stroke="#E85A2A" marker-end="url(#seta-laranja)"/>
    <path d="M1022 276 V220" stroke="#E85A2A" marker-end="url(#seta-laranja)"/>
  </g>
</svg>
