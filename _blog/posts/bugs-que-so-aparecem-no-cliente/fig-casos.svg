<text x="890" y="444">trashOrDelete.test.ts</text><text x="890" y="470" fill="#B4B9C2" font-weight="400">fallback no código</text>
<text x="890" y="522">failOnBuildMachinePaths</text><text x="890" y="548" fill="#B4B9C2" font-weight="400">vite.main.config.mjs</text></g>
