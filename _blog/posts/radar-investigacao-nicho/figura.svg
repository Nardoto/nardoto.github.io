<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t"><title id="t">Da pesquisa à decisão</title><rect width="1200" height="380" rx="18" fill="#141414"/><g font-family="Inter,'Segoe UI',Arial,sans-serif"><text x="48" y="76" fill="#fff" font-size="32" font-weight="700">Da pesquisa à decisão</text><g><rect x="48" y="138" width="352" height="190" rx="14" fill="#1A1A1A"/><text x="72" y="185" fill="#FF8A5C" font-size="20" font-weight="700">PESQUISAR</text><text x="72" y="235" fill="#fff" font-size="25">Reunir canais</text><text x="72" y="274" fill="#B4B9C2" font-size="22">e referências</text></g><g><rect x="424" y="138" width="352" height="190" rx="14" fill="#1A1A1A"/><text x="448" y="185" fill="#FF8A5C" font-size="20" font-weight="700">EXAMINAR</text><text x="448" y="235" fill="#fff" font-size="25">Conferir contexto</text><text x="448" y="274" fill="#B4B9C2" font-size="22">e limites dos dados</text></g><g><rect x="800" y="138" width="352" height="190" rx="14" fill="#1A1A1A"/><text x="824" y="185" fill="#FF8A5C" font-size="20" font-weight="700">DECIDIR</text><text x="824" y="235" fill="#fff" font-size="25">Avaliar hipóteses</text><text x="824" y="274" fill="#B4B9C2" font-size="22">com olhar crítico</text></g></g></svg>