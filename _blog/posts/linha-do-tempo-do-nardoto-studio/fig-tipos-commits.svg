<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" font-family="Inter,'Segoe UI',Arial,sans-serif" role="img" aria-labelledby="t">
<title id="t">Gráfico de barras: 672 commits de funcionalidade, 533 de correção, 114 de release e o resto em menor número</title>
