<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t" font-family="Inter,'Segoe UI',Arial,sans-serif">
  <title id="t">Canais marcados como removidos por mês em 2026: 796 em julho, 674 em agosto, 520 em setembro, 438 em outubro e 251 em novembro, 2.679 no total</title>
  <rect width="1200" height="440" rx="18" fill="#141414"/>

